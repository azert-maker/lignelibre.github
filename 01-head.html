<title>Ligne Libre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 3D plein écran en fond permanent ; menus en feuilles latérales vitrées, HUD en instruments de bord */
:root{
  --ink:#0a0f14;
  --fg:#eef3f1;
  --muted:#a7b3b6;
  --glass:rgba(8,13,18,.72);
  --glass2:rgba(255,255,255,.06);
  --line:rgba(238,243,241,.16);
  --warn:#ff5a4f;
  --good:#7ee08a;
  --gold:#f5c542;
  --silver:#cfd6dc;
  --bronze:#d08a52;
  --accent:#8fd3ff;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#speedlines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#demoTag{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;z-index:3}
#demoTag i{width:8px;height:8px;border-radius:50%;background:#ff4f4f;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:700px){#demoTag{top:auto;bottom:calc(64% + 10px)}}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.5) 100%);opacity:.45}
button{font:inherit;color:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- ACCUEIL ---------- */
.screen{position:fixed;inset:0}
#home{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr auto;gap:20px;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(6,10,14,.88) 0%,rgba(6,10,14,.45) 40%,rgba(6,10,14,0) 70%);overflow-y:auto}
.home-top{grid-column:1/-1;align-self:start}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,124px);line-height:.84;letter-spacing:-.04em;margin:0;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.logo span{color:transparent;-webkit-text-stroke:2px var(--accent)}
.tag{margin:12px 0 0;max-width:46ch;color:var(--muted);font-size:15px;line-height:1.5}
.home-nav{display:flex;flex-direction:column;gap:2px;align-self:end;max-width:460px}
.navbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:14px;padding:8px 12px;border-radius:3px;border-left:3px solid transparent;transition:background .15s,border-color .15s,transform .15s}
.navbtn b{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;line-height:1}
.navbtn small{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.navbtn:hover,.navbtn:focus-visible{background:var(--glass2);border-left-color:var(--accent);transform:translateX(4px)}
.navbtn:focus-visible{outline:none}
.navbtn.primary b{color:var(--accent)}
.profile-chip{align-self:end;justify-self:end;display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer}
.profile-chip .av{width:34px;height:34px;border-radius:50%;border:2px solid var(--fg)}
.profile-chip b{font-family:var(--display);font-weight:800;font-size:15px}
.profile-chip small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (max-width:700px){#home{grid-template-columns:1fr;background:linear-gradient(0deg,rgba(6,10,14,.92) 0%,rgba(6,10,14,.5) 55%,rgba(6,10,14,.2) 100%)}.profile-chip{justify-self:start}}

/* ---------- FEUILLES ---------- */
.sheetwrap{display:flex;pointer-events:none}
.sheet{pointer-events:auto;width:min(580px,100%);height:100%;background:var(--glass);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(2px)}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line)}
.sh-head h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.back{cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;flex:none}
.sh-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:18px}
.sh-foot{padding:12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>label,.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl b{color:var(--fg);font-weight:600;letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-family:var(--mono);font-size:12px;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--accent)}
.txt{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-family:var(--mono);font-size:14px;width:100%;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border-radius:3px;padding:12px 18px;border:1px solid var(--line);background:transparent;font-family:var(--display);font-weight:800;font-size:16px}
.btn.primary{background:var(--accent);color:#081017;border-color:var(--accent)}
.btn.small{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.7;margin-left:6px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.sport-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scard{all:unset;box-sizing:border-box;cursor:pointer;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--glass2);display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.scard:hover,.scard:focus-visible{border-color:var(--c);transform:translateY(-2px)}
.scard .place{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.scard h3{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1}
.scard p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.scard .best{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.tab{cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 12px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--glass2);cursor:pointer;text-align:left}
.item[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.item h4{margin:0;font-family:var(--display);font-weight:800;font-size:17px}
.item p{margin:0;font-size:12.5px;color:var(--muted);grid-column:1/-1}
.item .tagr{font-family:var(--mono);font-size:11px;color:var(--muted);align-self:center}
.item .tagr.lock{color:var(--gold)}
.stbars{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.stb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.stb span{width:74px;flex:none}
.stb i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.stb i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--accent);border-radius:3px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{border-color:var(--fg);transform:scale(1.1)}
.sw.lock{opacity:.35;cursor:not-allowed}
.shopcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--glass2)}
.shopcard h4{margin:0;font-family:var(--display);font-weight:800;font-size:18px}
.shopcard p{margin:0;font-size:13px;color:var(--muted);grid-column:1/-1;line-height:1.45}
.shopcard .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.adprog{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.dots i.on{background:var(--gold)}
.owned{font-family:var(--mono);font-size:12px;color:var(--good)}
.rtable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
.rtable th{text-align:left;font-weight:400;color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line)}
.rtable td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.rtable tr.me td{color:var(--accent)}
.medal{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.medal.g{background:var(--gold)}.medal.s{background:var(--silver)}.medal.b{background:var(--bronze)}.medal.n{background:rgba(255,255,255,.15)}
.code{font-family:var(--mono);font-weight:600;font-size:44px;letter-spacing:.18em;color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--glass2)}
.pl .av{width:24px;height:24px;border-radius:50%;flex:none}
.pl b{font-family:var(--display);font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pl .ok{color:var(--good)}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--glass2);text-align:left}
.gitem b{font-family:var(--display);font-weight:800;font-size:16px}
.gitem small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stat-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stat-line b{color:var(--fg);font-weight:600}
@media (max-width:700px){.sheet{width:100%;height:62%;margin-top:auto;border-right:none;border-top:1px solid var(--line)}.sheetwrap{align-items:flex-end}#garage .sheet{height:58%}.sport-cards{grid-template-columns:1fr}.sh-head h2{font-size:22px}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.75),0 1px 14px rgba(0,0,0,.5)}
.hud-tl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.hud-tl .r1{display:flex;gap:12px;align-items:center}
.pbtn{pointer-events:auto;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.mname{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.timer{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{font-family:var(--mono);font-size:12px;background:var(--glass);border:1px solid var(--line);border-radius:3px;padding:5px 9px;text-shadow:none;align-self:flex-start}
.prog b{color:var(--accent)}
.mp{display:flex;flex-direction:column;gap:3px;text-shadow:none}
.mp div{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;background:var(--glass);padding:3px 8px;border-radius:3px;min-width:160px}
.mp div i{width:10px;height:10px;border-radius:50%;flex:none}
.mp div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp div.me{outline:1px solid var(--accent)}
.hud-tr{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{font-family:var(--mono);font-weight:600;font-size:36px;font-variant-numeric:tabular-nums;line-height:1}
.coinc{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:17px;color:#ffd56b;text-shadow:0 1px 6px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}.coinc i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffc533 55%,#b37a00);box-shadow:0 0 8px rgba(255,197,51,.6)}.coinc span{font-size:11px;font-weight:500;opacity:.8;letter-spacing:.04em}.coinc.pop{animation:coinPop .32s ease-out}#oStats .stat.wide{grid-column:1/-1}#oStats .v.small{font-size:13px;font-weight:500;line-height:1.35}@keyframes coinPop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.mult{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);min-height:26px}
.feed{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-height:80px}
.fi{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--fg);background:var(--glass);padding:3px 8px;border-radius:3px;border-left:2px solid var(--accent);animation:fin .25s ease-out;transition:opacity .5s,transform .5s}
.fi.out{opacity:0;transform:translateX(12px)}
@keyframes fin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.spd{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:150px;height:150px}
.spd svg{width:100%;height:100%;overflow:visible}
.spd circle{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(150deg);transform-origin:60px 60px}
.spd .trk{stroke:rgba(255,255,255,.16);stroke-dasharray:66.7 100}
.spd .fil{stroke:var(--accent);stroke-dasharray:0 100;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.spd-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
.spd-n b{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.spd-n span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.spd-n em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:14px}
.inst{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:270px;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;text-shadow:none}
.ihead{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ro{display:flex;flex-direction:column;gap:1px;min-width:0}
.ro span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ro b{font-family:var(--mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.ro b small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.ro b.bad{color:var(--warn)}.ro b.ok{color:var(--good)}
.barline{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.barline .bt{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.barline .bt i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:4px}
.barline .bt i.hot{background:var(--warn)}
.barline b{font-family:var(--mono);font-size:13px;color:var(--fg);min-width:34px;text-align:right}
.pace{display:flex;gap:10px;align-items:center;padding:8px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid transparent}
.pace.brake{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,transparent);animation:pulse .5s infinite alternate}
@keyframes pulse{to{background:color-mix(in srgb,var(--warn) 38%,transparent)}}
.pace svg{width:40px;height:40px;flex:none;stroke:var(--fg);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.pace .pn{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05}
.pace .pd{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pace.brake .pd{color:var(--fg)}
.prof{width:100%;height:64px;display:block;border-radius:3px;background:rgba(255,255,255,.05)}
.rhythm{display:flex;align-items:center;gap:10px}
.rhythm svg{width:38px;height:38px;flex:none}
.rhythm circle{fill:none;stroke-width:5;transform:rotate(-90deg);transform-origin:20px 20px}
.rhythm .t{font-family:var(--mono);font-size:12px}
.keys{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.keys kbd{display:inline-block;min-width:18px;text-align:center;padding:1px 5px;margin-right:4px;border:1px solid var(--line);border-radius:3px;color:var(--fg);background:rgba(8,13,18,.5)}
body.touch .keys{display:none!important}
.toast{position:absolute;left:50%;top:26%;transform:translate(-50%,0);font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,46px);letter-spacing:-.02em;color:var(--accent);opacity:0;white-space:nowrap}
.toast.show{animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.04)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.count{position:absolute;inset:0 0 auto 0;top:9%;display:grid;place-items:center;pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.35);font-family:var(--display);font-weight:800;font-size:clamp(70px,13vw,150px);color:var(--fg);letter-spacing:-.05em}
@media (max-width:820px){
  .inst{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:calc(12px + env(safe-area-inset-right,0px));width:190px;padding:9px;gap:7px}
  .hud-tr{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .ro b{font-size:17px}.pace .pn{font-size:15px}.prof{height:48px}
