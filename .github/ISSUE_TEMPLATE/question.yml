name: Question
description: A question about the game, the controls, the code or contributing
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context (optional)
      placeholder: "e.g. I want to contribute a 3D model, I play on a tablet..."
