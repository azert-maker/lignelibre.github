name: Bug report
description: Something in the game does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! A precise report gets fixed much faster.
        Please check first that the bug is not already reported (issue search) or listed in `docs/KNOWN_ISSUES.md`.
        **Security issue or serious exploit (infinite coins, multiplayer cheating, save tampering): do not post it here.** Follow `SECURITY.md`.
  - type: dropdown
    id: area
    attributes:
      label: Sport or screen
      options:
        - Wingsuit (Lauterbrunnen)
        - Downhill (Mount Tamalpais)
        - Snowboard (Whistler)
        - BMX (Venice Beach)
        - Motocross (Glen Helen)
        - Wakeboard (Lake Havasu)
        - Parkour (Paris Rooftops)
        - Home / garage / shop / skin machine
        - Multiplayer
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome 130 on Windows 11, Safari on iPhone 13, Firefox on Android"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Where do you play?
      options:
        - Online version (GitHub Pages)
        - Downloaded HTML file
        - Built from this repository
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick BMX, free mode, press Play
        2. Jump off the left quarter pipe
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: A screenshot or a short video helps a lot. Browser console errors (F12) are welcome.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Often
        - Only once
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My report contains no password, PIN, token or personal data (address, phone number...).
          required: true
