# Publie le jeu sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
# Aucun secret : le site est un fichier HTML statique construit par build.sh.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Construire le site (fichier unique + modèles embarqués)
        run: LL_COPY_PARENT=0 sh build.sh && node --check dist/bundle.js && test -s dist/site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
