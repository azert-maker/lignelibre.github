# Build, lint and test on every pull request and on every push to main.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Audit production and dev dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build (single HTML file with embedded models)
        run: npm run build
      - name: Lint (correctness rules on the assembled bundle, server and tests)
        run: npm run lint
      - name: Test suite (7 sports, models, landings, shop, economy, launch flow, LAN server)
        run: npm test
      - name: Scripted BMX tricks
        run: npm run test:bmx
      - uses: actions/upload-artifact@v7
        with:
          name: ligne-libre-html
          path: dist/ligne-libre-standalone.html
          retention-days: 14
