name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build (fichier unique + GLB embarqués)
        run: npm run build
      - name: Régression 7 sports + modèles Blender
        run: npm test
      - name: Figures BMX scénarisées
        run: npm run test:bmx
      - uses: actions/upload-artifact@v4
        with:
          name: ligne-libre-html
          path: dist/ligne-libre-standalone.html
          retention-days: 14
